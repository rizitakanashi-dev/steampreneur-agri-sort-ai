
name: Discord Activity Logger

on:
  push:
    branches: ["**"]
    tags: ["**"]

  pull_request:
    types:
      - opened
      - edited
      - closed
      - reopened
      - synchronize
      - ready_for_review
      - review_requested

  pull_request_review:
    types: [submitted]

  issues:
    types: [opened, edited, closed, reopened, assigned]

  issue_comment:
    types: [created]

  release:
    types: [published, prereleased]

  create:
  delete:

  fork:

  watch:
    types: [started]

  discussion:
    types: [created, edited, answered, closed, reopened]

  discussion_comment:
    types: [created]

  workflow_run:
    workflows: ["CI", "Build", "Test", "Deploy"]
    types: [completed]

permissions: {}

jobs:
  discord-notify:
    runs-on: ubuntu-latest

    # Jangan kirim secret untuk PR dari fork.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Build Discord Embed
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          REPOSITORY: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          SERVER_URL: ${{ github.server_url }}
          EVENT_PATH: ${{ github.event_path }}
        run: |
          jq -n \
            --slurpfile event "$EVENT_PATH" \
            --arg event "$EVENT_NAME" \
            --arg action "$EVENT_ACTION" \
            --arg repo "$REPOSITORY" \
            --arg actor "$ACTOR" \
            --arg ref "$REF_NAME" \
            --arg sha "$SHA" \
            --arg server "$SERVER_URL" \
            '
            def clean($s; $limit):
              (($s // "Tidak tersedia") | tostring | .[0:$limit]);

            $e = $event[0] |
            $pr = ($e.pull_request // {}) |
            $issue = ($e.issue // {}) |
            $release = ($e.release // {}) |
            $run = ($e.workflow_run // {}) |
            $discussion = ($e.discussion // {}) |
            $commit = ($e.head_commit // {}) |

            $title = (
              if $event == "push" then "New Push"
              elif $event == "pull_request" then "Pull Request"
              elif $event == "pull_request_review" then "Pull Request Review"
              elif $event == "issues" then "Issue Activity"
              elif $event == "issue_comment" then "Issue Comment"
              elif $event == "release" then "New Release"
              elif $event == "create" then "Git Reference Created"
              elif $event == "delete" then "Git Reference Deleted"
              elif $event == "fork" then "Repository Forked"
              elif $event == "watch" then "Repository Starred"
              elif $event == "discussion" then "Discussion Activity"
              elif $event == "discussion_comment" then "Discussion Comment"
              elif $event == "workflow_run" then "Workflow Completed"
              else "GitHub Activity"
              end
            ) |

            $url = (
              if $event == "push" then ($e.compare // "")
              elif $event == "pull_request" or $event == "pull_request_review" then ($pr.html_url // "")
              elif $event == "issues" or $event == "issue_comment" then ($issue.html_url // "")
              elif $event == "release" then ($release.html_url // "")
              elif $event == "fork" then ($e.forkee.html_url // "")
              elif $event == "discussion" or $event == "discussion_comment" then ($discussion.html_url // "")
              elif $event == "workflow_run" then ($run.html_url // "")
              else ($server + "/" + $repo)
              end
            ) |

            $description = (
              if $event == "push" then clean($commit.message; 4000)
              elif $event == "pull_request" then clean($pr.title; 4000)
              elif $event == "pull_request_review" then clean($e.review.body; 4000)
              elif $event == "issues" then clean($issue.title; 4000)
              elif $event == "issue_comment" then clean($e.comment.body; 4000)
              elif $event == "release" then clean($release.body; 4000)
              elif $event == "workflow_run" then clean($run.name; 4000)
              elif $event == "discussion" then clean($discussion.title; 4000)
              elif $event == "discussion_comment" then clean($e.comment.body; 4000)
              elif $event == "fork" then clean($e.forkee.full_name; 4000)
              elif $event == "create" or $event == "delete" then clean($e.ref; 4000)
              else "Aktivitas baru pada repository."
              end
            ) |

            $color = (
              if $event == "workflow_run" then
                if $run.conclusion == "success" then 5763719
                elif $run.conclusion == "failure" then 15548997
                else 16776960 end
              elif $event == "pull_request" and $action == "closed" and $pr.merged then 5763719
              elif $action == "closed" or $action == "deleted" then 15548997
              elif $event == "release" or $event == "push" then 5763719
              else 3447003
              end
            ) |

            $branch = (
              if $event == "pull_request" then
                (($pr.head.ref // "?") + " → " + ($pr.base.ref // "?"))
              elif $event == "workflow_run" then ($run.head_branch // $ref)
              elif $event == "push" then $ref
              else ($e.ref // $ref)
              end
            ) |

            $details = (
              if $event == "push" then
                "Commit: " + clean($sha; 7) +
                "\nJumlah commit: " + (($e.commits // []) | length | tostring)
              elif $event == "pull_request" then
                "PR #" + (($pr.number // 0) | tostring) +
                "\nMerged: " + (($pr.merged // false) | tostring)
              elif $event == "issues" or $event == "issue_comment" then
                "Issue #" + (($issue.number // 0) | tostring)
              elif $event == "workflow_run" then
                "Status: " + ($run.conclusion // "unknown") +
                "\nRun #" + (($run.run_number // 0) | tostring)
              elif $event == "release" then
                "Tag: " + ($release.tag_name // "?") +
                "\nDraft: " + (($release.draft // false) | tostring)
              elif $event == "create" or $event == "delete" then
                "Tipe: " + ($e.ref_type // "?")
              else
                "Event: " + $event
              end
            ) |

            (
              {
                title: $title,
                description: $description,
                color: $color,
                fields: [
                  {
                    name: "Repository",
                    value: clean($repo; 1024),
                    inline: true
                  },
                  {
                    name: "Actor",
                    value: clean($actor; 1024),
                    inline: true
                  },
                  {
                    name: "Action",
                    value: clean($action; 1024),
                    inline: true
                  },
                  {
                    name: "Branch / Reference",
                    value: clean($branch; 1024),
                    inline: false
                  },
                  {
                    name: "Details",
                    value: clean($details; 1024),
                    inline: false
                  }
                ],
                footer: {
                  text: "GitHub Activity Logger"
                }
              }
              + (if $url != "" then {url: $url} else {} end)
            ) as $embed |

            {
              allowed_mentions: {
                parse: []
              },
              embeds: [$embed]
            }
            ' > discord-payload.json

      - name: Send to Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "::error::DISCORD_WEBHOOK secret is missing"
            exit 1
          fi

          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --retry 3 \
            --retry-delay 2 \
            --retry-all-errors \
            -H "Content-Type: application/json" \
            -X POST \
            -d @discord-payload.json \
            "${DISCORD_WEBHOOK}?wait=true"
