name: Discord Activity Logger

on:
  # Push dan commit
  push:
    branches: ["**"]
    tags: ["**"]

  # Pull requests
  pull_request:
    types:
      - opened
      - edited
      - closed
      - reopened
      - synchronize
      - ready_for_review
      - review_requested

  pull_request_review:
    types:
      - submitted

  # Issues
  issues:
    types:
      - opened
      - edited
      - closed
      - reopened
      - assigned

  issue_comment:
    types:
      - created

  # Releases
  release:
    types:
      - published
      - prereleased

  # Branch dan tag
  create:
  delete:

  # Fork dan star
  fork:

  watch:
    types:
      - started

  # Discussions
  discussion:
    types:
      - created
      - edited
      - answered
      - closed
      - reopened

  discussion_comment:
    types:
      - created

  # CI/CD
  # Sesuaikan nama workflow dengan repository.
  workflow_run:
    workflows:
      - "CI"
      - "Build"
      - "Test"
      - "Deploy"
    types:
      - completed

# Tidak membutuhkan permission repository.
permissions: {}

jobs:
  discord-notify:
    name: Send Discord Notification
    runs-on: ubuntu-latest

    # Lewati PR dari fork agar secret tidak terekspos.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository

    steps:
      # ==========================================
      # BUILD DISCORD EMBED
      # ==========================================
      - name: Build Discord Embed
        id: build
        shell: bash
        env:
          DISCORD_EVENT: ${{ github.event_name }}
          DISCORD_ACTION: ${{ github.event.action }}
          DISCORD_REPOSITORY: ${{ github.repository }}
          DISCORD_ACTOR: ${{ github.actor }}
          DISCORD_REF: ${{ github.ref_name }}
          DISCORD_SHA: ${{ github.sha }}
          DISCORD_SERVER: ${{ github.server_url }}
        run: |
          set -euo pipefail

          echo "================================"
          echo "GitHub Discord Activity Logger"
          echo "================================"

          echo "Event: $DISCORD_EVENT"
          echo "Actor: $DISCORD_ACTOR"
          echo "Repository: $DISCORD_REPOSITORY"
          echo "Event file: $GITHUB_EVENT_PATH"

          # Pastikan event JSON tersedia.
          if [ ! -f "$GITHUB_EVENT_PATH" ]; then
            echo "::error::GitHub event JSON not found"
            exit 1
          fi

          # Pastikan JSON valid.
          jq -e . "$GITHUB_EVENT_PATH" > /dev/null

          # Buat Discord Embed.
          jq -n \
            --slurpfile event "$GITHUB_EVENT_PATH" \
            --arg event_name "$DISCORD_EVENT" \
            --arg action "$DISCORD_ACTION" \
            --arg repo "$DISCORD_REPOSITORY" \
            --arg actor "$DISCORD_ACTOR" \
            --arg ref "$DISCORD_REF" \
            --arg sha "$DISCORD_SHA" \
            --arg server "$DISCORD_SERVER" \
            '
            def clean($value; $limit):
              (
                ($value // "Tidak tersedia")
                | tostring
                | .[0:$limit]
              );

            $event[0] as $e |

            ($e.pull_request // {}) as $pr |
            ($e.issue // {}) as $issue |
            ($e.release // {}) as $release |
            ($e.workflow_run // {}) as $run |
            ($e.discussion // {}) as $discussion |
            ($e.head_commit // {}) as $commit |

            # =====================================
            # EVENT TITLE
            # =====================================

            (
              if $event_name == "push" then
                "New Push"

              elif $event_name == "pull_request" then
                "Pull Request Activity"

              elif $event_name == "pull_request_review" then
                "Pull Request Review"

              elif $event_name == "issues" then
                "Issue Activity"

              elif $event_name == "issue_comment" then
                "New Issue Comment"

              elif $event_name == "release" then
                "New Release Published"

              elif $event_name == "create" then
                "Git Reference Created"

              elif $event_name == "delete" then
                "Git Reference Deleted"

              elif $event_name == "fork" then
                "Repository Forked"

              elif $event_name == "watch" then
                "Repository Starred"

              elif $event_name == "discussion" then
                "Discussion Activity"

              elif $event_name == "discussion_comment" then
                "New Discussion Comment"

              elif $event_name == "workflow_run" then
                "CI/CD Workflow Completed"

              else
                "GitHub Activity"
              end
            ) as $title |

            # =====================================
            # EVENT URL
            # =====================================

            (
              if $event_name == "push" then
                ($e.compare // "")

              elif $event_name == "pull_request" then
                ($pr.html_url // "")

              elif $event_name == "pull_request_review" then
                ($pr.html_url // "")

              elif $event_name == "issues" then
                ($issue.html_url // "")

              elif $event_name == "issue_comment" then
                ($e.comment.html_url // $issue.html_url // "")

              elif $event_name == "release" then
                ($release.html_url // "")

              elif $event_name == "fork" then
                ($e.forkee.html_url // "")

              elif $event_name == "discussion" then
                ($discussion.html_url // "")

              elif $event_name == "discussion_comment" then
                ($e.comment.html_url // $discussion.html_url // "")

              elif $event_name == "workflow_run" then
                ($run.html_url // "")

              else
                ($server + "/" + $repo)
              end
            ) as $url |

            # =====================================
            # DESCRIPTION
            # =====================================

            (
              if $event_name == "push" then
                clean($commit.message; 4000)

              elif $event_name == "pull_request" then
                clean($pr.title; 4000)

              elif $event_name == "pull_request_review" then
                clean(
                  ($e.review.body // $e.review.state // "Review submitted");
                  4000
                )

              elif $event_name == "issues" then
                clean($issue.title; 4000)

              elif $event_name == "issue_comment" then
                clean($e.comment.body; 4000)

              elif $event_name == "release" then
                clean($release.body; 4000)

              elif $event_name == "workflow_run" then
                clean($run.name; 4000)

              elif $event_name == "discussion" then
                clean($discussion.title; 4000)

              elif $event_name == "discussion_comment" then
                clean($e.comment.body; 4000)

              elif $event_name == "fork" then
                clean($e.forkee.full_name; 4000)

              elif $event_name == "create" or $event_name == "delete" then
                clean($e.ref; 4000)

              else
                "Aktivitas baru pada repository."
              end
            ) as $description |

            # =====================================
            # EMBED COLOR
            # =====================================

            (
              if $event_name == "workflow_run" then

                if $run.conclusion == "success" then
                  5763719
                elif $run.conclusion == "failure" then
                  15548997
                elif $run.conclusion == "cancelled" then
                  16776960
                else
                  9807270
                end

              elif $event_name == "pull_request"
                and $action == "closed"
                and ($pr.merged // false) then
                5763719

              elif $action == "closed" or $action == "deleted" then
                15548997

              elif $event_name == "release" or $event_name == "push" then
                5763719

              else
                3447003
              end
            ) as $color |

            # =====================================
            # BRANCH / REFERENCE
            # =====================================

            (
              if $event_name == "pull_request" then
                (
                  ($pr.head.ref // "?")
                  + " -> "
                  + ($pr.base.ref // "?")
                )

              elif $event_name == "workflow_run" then
                ($run.head_branch // $ref)

              elif $event_name == "push" then
                $ref

              else
                ($e.ref // $ref)
              end
            ) as $branch |

            # =====================================
            # EVENT DETAILS
            # =====================================

            (
              if $event_name == "push" then
                "Commit: "
                + clean($sha; 7)
                + "\nJumlah commit: "
                + (($e.commits // []) | length | tostring)

              elif $event_name == "pull_request" then
                "PR #"
                + (($pr.number // 0) | tostring)
                + "\nMerged: "
                + (($pr.merged // false) | tostring)

              elif $event_name == "pull_request_review" then
                "PR #"
                + (($pr.number // 0) | tostring)
                + "\nReview: "
                + ($e.review.state // "submitted")

              elif $event_name == "issues" then
                "Issue #"
                + (($issue.number // 0) | tostring)

              elif $event_name == "issue_comment" then
                "Issue #"
                + (($issue.number // 0) | tostring)

              elif $event_name == "workflow_run" then
                "Status: "
                + ($run.conclusion // "unknown")
                + "\nRun: #"
                + (($run.run_number // 0) | tostring)

              elif $event_name == "release" then
                "Tag: "
                + ($release.tag_name // "?")
                + "\nPrerelease: "
                + (($release.prerelease // false) | tostring)

              elif $event_name == "create" or $event_name == "delete" then
                "Reference type: "
                + ($e.ref_type // "?")

              elif $event_name == "fork" then
                "Forked repository: "
                + ($e.forkee.full_name // "?")

              elif $event_name == "watch" then
                "Action: "
                + ($action // "started")

              elif $event_name == "discussion" then
                "Discussion #"
                + (($discussion.number // 0) | tostring)

              elif $event_name == "discussion_comment" then
                "Discussion #"
                + (($discussion.number // 0) | tostring)

              else
                "Event: " + $event_name
              end
            ) as $details |

            # =====================================
            # TIMESTAMP
            # =====================================

            (
              $commit.timestamp
              // $pr.updated_at
              // $issue.updated_at
              // $release.published_at
              // $run.updated_at
              // $discussion.updated_at
              // $e.comment.created_at
              // $e.review.submitted_at
              // $e.repository.updated_at
              // null
            ) as $timestamp |

            # =====================================
            # FINAL DISCORD EMBED
            # =====================================

            (
              {
                title: $title,
                description: $description,
                color: $color,

                fields: [
                  {
                    name: "Repository",
                    value: clean($repo; 1024),
                    inline: true
                  },
                  {
                    name: "Actor",
                    value: clean($actor; 1024),
                    inline: true
                  },
                  {
                    name: "Action",
                    value: clean($action; 1024),
                    inline: true
                  },
                  {
                    name: "Branch / Reference",
                    value: clean($branch; 1024),
                    inline: false
                  },
                  {
                    name: "Details",
                    value: clean($details; 1024),
                    inline: false
                  }
                ],

                footer: {
                  text: "GitHub Activity Logger"
                }
              }

              + (
                  if $url != "" then
                    {url: $url}
                  else
                    {}
                  end
                )

              + (
                  if $timestamp != null then
                    {timestamp: $timestamp}
                  else
                    {}
                  end
                )
            ) as $embed |

            {
              allowed_mentions: {
                parse: []
              },
              embeds: [$embed]
            }
            ' > discord-payload.json

          echo "Discord payload generated successfully."

          # Pastikan hasil akhir adalah JSON valid.
          jq -e '.embeds | length == 1' discord-payload.json > /dev/null

      # ==========================================
      # SEND TO DISCORD
      # ==========================================
      - name: Send to Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${DISCORD_WEBHOOK:-}" ]; then
            echo "::error::DISCORD_WEBHOOK secret is missing"
            exit 1
          fi

          echo "Sending notification to Discord..."

          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --retry 3 \
            --retry-delay 2 \
            --retry-all-errors \
            --max-time 30 \
            -H "Content-Type: application/json" \
            -X POST \
            -d @discord-payload.json \
            -o /dev/null \
            "${DISCORD_WEBHOOK}?wait=true"

          echo "Discord notification sent successfully!"
